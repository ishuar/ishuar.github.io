name: Build Portfolio and Deploy
env:
  CI: false
  GITHUB_USERNAME: ${{ github.repository_owner }}
  # GH_PAT is a fine-grained token: public repositories, read-only, no extra
  # permissions. Falls back to github.token when the secret is unset.
  REACT_APP_GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
  USE_GITHUB_DATA: "true"
  MEDIUM_USERNAME: "ishuar" # Change this to your medium username
on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - '**/ISSUE_TEMPLATE/**'

  schedule:
    - cron: "0 12 * * 1" ## “At 12:00 on every Monday.”
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4 # If you're using actions/checkout@v2 you must set persist-credentials to false in most cases for the deployment to work correctly.
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          folder: build # The folder the action should deploy.
          token: ${{ github.token }}
